# libs.versions.toml
# This is the Gradle version catalog file.

[versions]
java-uuid-generator       = "5.2.0"
mapstruct                 = "1.6.3"
microprofile-config-api   = "3.1.1"
microprofile-graphql-api  = "2.0"
quarkus                   = "3.36.2"
quarkus-logging-json      = "3.5.0"
quarkus-platform          = "3.36.2"

[libraries]
# Hibernate
hibernate-core      = { module = "org.hibernate.orm:hibernate-core" }
hibernate-processor = { module = "org.hibernate.orm:hibernate-processor" }

# Jackson
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind    = { module = "com.fasterxml.jackson.core:jackson-databind" }

# Jakarta API
jakarta-cdi-api         = { module = "jakarta.enterprise:jakarta.enterprise.cdi-api" }
jakarta-data-api        = { module = "jakarta.data:jakarta.data-api" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api" }
jakarta-validation-api  = { module = "jakarta.validation:jakarta.validation-api" }
jakarta-ws-rs-api       = { module = "jakarta.ws.rs:jakarta.ws.rs-api" }

# Fasterxml
jug = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "java-uuid-generator" }

# JBoss
jboss-logging = { module = "org.jboss.logging:jboss-logging" }

# MapStruct
mapstruct           = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# Microprofile API
microprofile-config-api      = { module = "org.eclipse.microprofile.config:microprofile-config-api" }
microprofile-graphql-api     = { module = "org.eclipse.microprofile.graphql:microprofile-graphql-api", version.ref = "microprofile-graphql-api" }
microprofile-rest-client-api = { module = "org.eclipse.microprofile.rest.client:microprofile-rest-client-api" }

# Quarkus Extension
quarkus-bom                 = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus-platform" }
quarkus-arc                 = { module = "io.quarkus:quarkus-arc" }
quarkus-fault-tolerance     = { module = "io.quarkus:quarkus-smallrye-fault-tolerance" }
quarkus-flyway              = { module = "io.quarkus:quarkus-flyway" }
quarkus-graphql             = { module = "io.quarkus:quarkus-smallrye-graphql" }
quarkus-health              = { module = "io.quarkus:quarkus-smallrye-health" }
quarkus-hibernate-orm       = { module = "io.quarkus:quarkus-hibernate-orm" }
quarkus-hibernate-validator = { module = "io.quarkus:quarkus-hibernate-validator" }
quarkus-jdbc-postgresql     = { module = "io.quarkus:quarkus-jdbc-postgresql" }
quarkus-junit               = { module = "io.quarkus:quarkus-junit" }
quarkus-logging             = { module = "io.quarkiverse.loggingjson:quarkus-logging-json", version.ref = "quarkus-logging-json" }
quarkus-messaging           = { module = "io.quarkus:quarkus-messaging" }
quarkus-messaging-rabbitmq  = { module = "io.quarkus:quarkus-messaging-rabbitmq" }
quarkus-prometheus          = { module = "io.quarkus:quarkus-micrometer-registry-prometheus" }
quarkus-rest                = { module = "io.quarkus:quarkus-rest" }
quarkus-rest-jackson        = { module = "io.quarkus:quarkus-rest-jackson" }
quarkus-rest-client-jackson = { module = "io.quarkus:quarkus-rest-client-jackson" }
quarkus-scheduler           = { module = "io.quarkus:quarkus-scheduler" }

# Quarkus API
quarkus-scheduler-api = { module = "io.quarkus:quarkus-scheduler-api" }

# SmallRye
smallrye-common-annotation           = { module = "io.smallrye.common:smallrye-common-annotation" }
smallrye-graphql-api                 = { module = "io.smallrye:smallrye-graphql-api" }
smallrye-reactive-messaging-api      = { module = "io.smallrye.reactive:smallrye-reactive-messaging-api" }
smallrye-reactive-messaging-rabbitmq = { module = "io.smallrye.reactive:smallrye-reactive-messaging-rabbitmq" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
