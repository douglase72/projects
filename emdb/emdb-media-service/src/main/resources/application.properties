# --------------------------------------------------------------------
# --- DEFAULT CONFIGURATION
# --------------------------------------------------------------------
quarkus.http.root-path=api
quarkus.http.port=60316

# --------------------------------------------------------------------
# --- DEFAULT TMDB CONFIGURATION
# --------------------------------------------------------------------
quarkus.rest-client.tmdb-image.url=http://image.tmdb.org/t/p/original

# --------------------------------------------------------------------
# --- DEFAULT MESSAGING CONFIGURATION
# --------------------------------------------------------------------
mp.messaging.incoming.save-movie-in.connector=smallrye-rabbitmq
mp.messaging.incoming.save-movie-in.exchange.name=emdb.commands
mp.messaging.incoming.save-movie-in.exchange.type=direct
mp.messaging.incoming.save-movie-in.routing-keys=movie.save
mp.messaging.incoming.save-movie-in.queue.name=emdb-media.save-movie
mp.messaging.incoming.save-movie-in.auto-bind-dlq=true
mp.messaging.incoming.save-movie-in.dead-letter-exchange=emdb.commands.dlx
mp.messaging.incoming.save-movie-in.dead-letter-routing-key=movie.save.dlq
mp.messaging.incoming.save-movie-in.dead-letter-queue-name=emdb-media.save-movie.dlq
mp.messaging.incoming.save-movie-in.failure-strategy=reject

mp.messaging.incoming.movie-dlq-in.connector=smallrye-rabbitmq
mp.messaging.incoming.movie-dlq-in.exchange.name=emdb.commands.dlx
mp.messaging.incoming.movie-dlq-in.exchange.type=direct
mp.messaging.incoming.movie-dlq-in.routing-keys=movie.save.dlq
mp.messaging.incoming.movie-dlq-in.queue.name=emdb-media.save-movie.dlq
mp.messaging.incoming.movie-dlq-in.failure-strategy=reject

# --------------------------------------------------------------------
# --- DEFAULT DATABASE CONFIGURATION
# --------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${db.username}
quarkus.datasource.password=${db.password}
quarkus.datasource.jdbc.additional-jdbc-properties.reWriteBatchedInserts=true
quarkus.hibernate-orm.database.default-schema=emdb_media
quarkus.hibernate-orm.jdbc.statement-batch-size=50
#quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.schemas=emdb_media
