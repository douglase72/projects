# --------------------------------------------------------------------
# --- DEFAULT CONFIGURATION
# --------------------------------------------------------------------
quarkus.http.root-path=/api/v1
quarkus.http.port=60312

# --------------------------------------------------------------------
# --- DEFAULT MESSAGING CONFIGURATION
# --------------------------------------------------------------------
mp.messaging.incoming.movies-scraped.connector=smallrye-kafka
mp.messaging.incoming.movies-scraped.topic=movies-scraped
mp.messaging.incoming.movies-scraped.group.id=emdb-media-service
mp.messaging.incoming.movies-scraped.auto.offset.reset=earliest
mp.messaging.incoming.movies-scraped.key.deserializer=org.apache.kafka.common.serialization.IntegerDeserializer
mp.messaging.incoming.movies-scraped.failure-strategy=dead-letter-queue
mp.messaging.incoming.movies-scraped.dead-letter-queue.topic=movies-scraped-dlq
mp.messaging.incoming.movies-scraped.fail-on-deserialization-failure=false

mp.messaging.outgoing.media-saved.connector=smallrye-kafka
mp.messaging.outgoing.media-saved.topic=media-saved
mp.messaging.outgoing.media-saved.key.serializer=org.apache.kafka.common.serialization.UUIDSerializer
