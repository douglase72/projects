quarkus.http.root-path=/api/v1
quarkus.http.port=60312

mp.messaging.incoming.extract-movies.connector=smallrye-kafka
mp.messaging.incoming.extract-movies.topic=emdb.extract.movies
mp.messaging.incoming.extract-movies.group.id=emdb-media-service
mp.messaging.incoming.extract-movies.auto.offset.reset=earliest
mp.messaging.incoming.extract-movies.key.deserializer=org.apache.kafka.common.serialization.IntegerDeserializer

mp.messaging.outgoing.media-events.connector=smallrye-kafka
mp.messaging.outgoing.media-events.topic=emdb.media.events
mp.messaging.outgoing.media-events.key.serializer=org.apache.kafka.common.serialization.UUIDSerializer
mp.messaging.outgoing.media-events.acks=all
