# --------------------------------------------------------------------
# --- DEFAULT CONFIGURATION
# --------------------------------------------------------------------
quarkus.http.root-path=/api/v1
quarkus.http.port=60314

# --------------------------------------------------------------------
# --- DEFAULT MESSAGING CONFIGURATION
# --------------------------------------------------------------------
mp.messaging.incoming.ingest-commands.connector=smallrye-rabbitmq
mp.messaging.incoming.ingest-commands.exchange.name=emdb.ingest.commands
mp.messaging.incoming.ingest-commands.exchange.type=direct
mp.messaging.incoming.ingest-commands.queue.name=emdb-ingest.ingest-media
mp.messaging.incoming.ingest-commands.routing-keys=ingest.media
mp.messaging.incoming.ingest-commands.max-outstanding-messages=1
mp.messaging.incoming.ingest-commands.queue.single-active-consumer=true

mp.messaging.outgoing.ingest-events.connector=smallrye-kafka
mp.messaging.outgoing.ingest-events.topic=emdb.ingest.events
mp.messaging.outgoing.ingest-events.key.serializer=org.apache.kafka.common.serialization.UUIDSerializer
mp.messaging.outgoing.ingest-events.acks=all

mp.messaging.outgoing.movies-scraped.connector=smallrye-kafka
mp.messaging.outgoing.movies-scraped.topic=emdb.movies.scraped
mp.messaging.outgoing.movies-scraped.key.serializer=org.apache.kafka.common.serialization.IntegerSerializer
mp.messaging.outgoing.movies-scraped.acks=all

# --------------------------------------------------------------------
# --- DEFAULT DATABASE CONFIGURATION
# --------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${db.username}
quarkus.datasource.password=${db.password}
quarkus.hibernate-orm.database.default-schema=scraper
quarkus.flyway.default-schema=scraper
quarkus.flyway.baseline-on-migrate=true
