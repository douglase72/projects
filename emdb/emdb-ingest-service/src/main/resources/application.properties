# --------------------------------------------------------------------
# --- DEFAULT CONFIGURATION
# --------------------------------------------------------------------
quarkus.http.root-path=/api/v1
quarkus.http.port=60310

# --------------------------------------------------------------------
# --- DEFAULT MESSAGING CONFIGURATION
# --------------------------------------------------------------------
mp.messaging.outgoing.ingest-commands.connector=smallrye-rabbitmq
mp.messaging.outgoing.ingest-commands.exchange.name=emdb.ingest.commands
mp.messaging.outgoing.ingest-commands.exchange.type=direct
mp.messaging.outgoing.ingest-commands.default-routing-key=ingest.media

mp.messaging.outgoing.ingest-events-out.connector=smallrye-kafka
mp.messaging.outgoing.ingest-events-out.topic=emdb.ingest.events
mp.messaging.outgoing.ingest-events-out.key.serializer=org.apache.kafka.common.serialization.UUIDSerializer
mp.messaging.outgoing.ingest-events-out.acks=all

mp.messaging.incoming.ingest-events-in.connector=smallrye-kafka
mp.messaging.incoming.ingest-events-in.topic=emdb.ingest.events
mp.messaging.incoming.ingest-events-in.group.id=emdb-ingest-service
mp.messaging.incoming.ingest-events-in.auto.offset.reset=earliest
mp.messaging.incoming.ingest-events-in.key.deserializer=org.apache.kafka.common.serialization.UUIDDeserializer

mp.messaging.incoming.media-events.connector=smallrye-kafka
mp.messaging.incoming.media-events.topic=emdb.media.events
mp.messaging.incoming.media-events.group.id=emdb-media-service
mp.messaging.incoming.media-events.auto.offset.reset=earliest
mp.messaging.incoming.media-events.key.deserializer=org.apache.kafka.common.serialization.UUIDDeserializer

# --------------------------------------------------------------------
# --- DEFAULT DATABASE CONFIGURATION
# --------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${db.username}
quarkus.datasource.password=${db.password}
quarkus.hibernate-orm.database.default-schema=ingest
quarkus.flyway.default-schema=ingest
quarkus.flyway.baseline-on-migrate=true
