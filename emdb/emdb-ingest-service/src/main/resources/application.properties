# --------------------------------------------------------------------
# --- DEFAULT CONFIGURATION
# --------------------------------------------------------------------
quarkus.http.root-path=/api/v1
quarkus.http.port=60310

# --------------------------------------------------------------------
# --- DEFAULT MESSAGING CONFIGURATION
# --------------------------------------------------------------------
mp.messaging.outgoing.ingest-media.connector=smallrye-rabbitmq
mp.messaging.outgoing.ingest-media.exchange.name=emdb.commands
mp.messaging.outgoing.ingest-media.exchange.type=direct
mp.messaging.outgoing.ingest-media.default-routing-key=ingest.media

mp.messaging.outgoing.ingest-events.connector=smallrye-kafka
mp.messaging.outgoing.ingest-events.topic=ingest-events
mp.messaging.outgoing.ingest-events.key.serializer=org.apache.kafka.common.serialization.UUIDSerializer

mp.messaging.incoming.ingest-events-in.connector=smallrye-kafka
mp.messaging.incoming.ingest-events-in.topic=ingest-events
mp.messaging.incoming.ingest-events-in.group.id=emdb-ingest-service
mp.messaging.incoming.ingest-events-in.auto.offset.reset=earliest
mp.messaging.incoming.ingest-events-in.key.deserializer=org.apache.kafka.common.serialization.UUIDDeserializer

mp.messaging.incoming.ingest-events-sse.connector=smallrye-kafka
mp.messaging.incoming.ingest-events-sse.topic=ingest-events
mp.messaging.incoming.ingest-events-sse.group.id=emdb-ingest-sse-${quarkus.uuid}
mp.messaging.incoming.ingest-events-sse.auto.offset.reset=latest
mp.messaging.incoming.ingest-events-sse.commit-strategy=ignore
mp.messaging.incoming.ingest-events-sse.key.deserializer=org.apache.kafka.common.serialization.UUIDDeserializer

mp.messaging.incoming.media-saved.connector=smallrye-kafka
mp.messaging.incoming.media-saved.topic=media-saved
mp.messaging.incoming.media-saved.group.id=emdb-ingest-service
mp.messaging.incoming.media-saved.auto.offset.reset=earliest
mp.messaging.incoming.media-saved.key.deserializer=org.apache.kafka.common.serialization.UUIDDeserializer

# --------------------------------------------------------------------
# --- DEFAULT DATABASE CONFIGURATION
# --------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${db.username}
quarkus.datasource.password=${db.password}
quarkus.hibernate-orm.database.default-schema=ingest
quarkus.flyway.default-schema=ingest
quarkus.flyway.baseline-on-migrate=true
