plugins {
  id 'java'
  alias(libs.plugins.quarkus)
}

group = 'com.erdouglass.emdb'
version = '1.0.0-SNAPSHOT'

dependencies {
  implementation      enforcedPlatform(libs.quarkus.bom)
  annotationProcessor enforcedPlatform(libs.quarkus.bom)
  annotationProcessor libs.lombok
  annotationProcessor libs.hibernate.processor
  
  implementation project(':common-rest')
  implementation project(':common-util')
  implementation project(':emdb-ingest-api')
  implementation project(':emdb-shared-kernel')
  
  compileOnly libs.lombok
  
  implementation libs.jakarta.data.api
  implementation libs.jug
  implementation libs.quarkus.arc
  implementation libs.quarkus.flyway
  implementation libs.quarkus.health
  implementation libs.quarkus.hibernate.orm
  implementation libs.quarkus.hibernate.validator
  implementation libs.quarkus.jdbc.postgresql
  implementation libs.quarkus.logging
  implementation libs.quarkus.messaging
  implementation libs.quarkus.messaging.kafka
  implementation libs.quarkus.messaging.rabbitmq 
  implementation libs.quarkus.rest
  implementation libs.quarkus.rest.jackson
    
  testImplementation libs.quarkus.junit
}
