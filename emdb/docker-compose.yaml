services:
  
  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: rabbitmq 
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   
    networks:
      - erd
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6              
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - erd
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:                              
    image: apache/kafka:4.3.0
    container_name: kafka-init
    networks:
      - erd
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic movies-scraped     --partitions 6 --replication-factor 1 --config cleanup.policy=compact
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic movies-scraped-dlq --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic movie-events       --partitions 6 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ingest-events      --partitions 6 --replication-factor 1
      "

  kafka-ui:                                
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: emdb
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - erd
    depends_on:
      kafka:
        condition: service_healthy       
            
  emdb-ingest:
    image: emdb-ingest:latest
    container_name: emdb-ingest
    build:
      context: ./emdb-ingest-service
      dockerfile: src/main/docker/Dockerfile
    ports:
      - 60330:60310
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./emdb-ingest-service/.env
    networks:
      - erd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:60310/api/v1/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully        

  emdb-scraper:
    image: emdb-scraper:latest
    container_name: emdb-scraper
    build:
      context: ./emdb-scraper-service
      dockerfile: src/main/docker/Dockerfile
    ports:
      - 60334:60314
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./emdb-scraper-service/.env
    networks:
      - erd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:60314/emdb/api/v1/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully        

  emdb-media:
    image: emdb-media:latest
    container_name: emdb-media
    build:
      context: ./emdb-media-service
      dockerfile: src/main/docker/Dockerfile
    ports:
      - 60332:60312
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./emdb-media-service/.env
    networks:
      - erd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:60312/api/v1/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully        
                
volumes:
  rabbitmq_data:
  kafka_data:
    
networks:
  erd:
    name: erd
    external: true
