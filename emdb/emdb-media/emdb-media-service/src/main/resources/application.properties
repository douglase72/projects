# --------------------------------------------------------------------
# --- DEFAULT CONFIGURATION
# --------------------------------------------------------------------
quarkus.http.root-path=api
quarkus.http.port=60316
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

# --------------------------------------------------------------------
# --- DEFAULT GRAPHQL CONFIGURATION
# --------------------------------------------------------------------
quarkus.smallrye-graphql.events.enabled=true
quarkus.smallrye-graphql.unwrap-exceptions=java.util.concurrent.CompletionException,java.util.concurrent.ExecutionException
quarkus.smallrye-graphql.error-extension-fields=code,classification
quarkus.smallrye-graphql.show-runtime-exception-message=com.erdouglass.common.graphql.ResourceNotFoundException

# --------------------------------------------------------------------
# --- DEFAULT MESSAGING CONFIGURATION
# --------------------------------------------------------------------
mp.messaging.incoming.save-movie-in.connector=smallrye-rabbitmq
mp.messaging.incoming.save-movie-in.exchange.name=emdb.commands
mp.messaging.incoming.save-movie-in.exchange.type=direct
mp.messaging.incoming.save-movie-in.routing-keys=movie.save
mp.messaging.incoming.save-movie-in.queue.name=emdb-media.save-movie

mp.messaging.incoming.save-person-in.connector=smallrye-rabbitmq
mp.messaging.incoming.save-person-in.exchange.name=emdb.commands
mp.messaging.incoming.save-person-in.exchange.type=direct
mp.messaging.incoming.save-person-in.routing-keys=person.save
mp.messaging.incoming.save-person-in.queue.name=emdb-media.save-person

mp.messaging.incoming.save-series-in.connector=smallrye-rabbitmq
mp.messaging.incoming.save-series-in.exchange.name=emdb.commands
mp.messaging.incoming.save-series-in.exchange.type=direct
mp.messaging.incoming.save-series-in.routing-keys=series.save
mp.messaging.incoming.save-series-in.queue.name=emdb-media.save-series

mp.messaging.outgoing.ingest-media-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.ingest-media-out.exchange.name=emdb.commands
mp.messaging.outgoing.ingest-media-out.exchange.type=direct
mp.messaging.outgoing.ingest-media-out.default-routing-key=media.ingest

# --------------------------------------------------------------------
# --- DEFAULT DATABASE CONFIGURATION
# --------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${db.username}
quarkus.datasource.password=${db.password}
quarkus.datasource.jdbc.additional-jdbc-properties.reWriteBatchedInserts=true
quarkus.hibernate-orm.database.default-schema=emdb_media
quarkus.hibernate-orm.jdbc.statement-batch-size=50
#quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.schemas=emdb_media

quarkus.flyway.baseline-on-migrate=true
