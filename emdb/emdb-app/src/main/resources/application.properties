# --------------------------------------------------------------------
# --- DEFAULT CONFIGURATION
# --------------------------------------------------------------------
quarkus.http.root-path=/emdb
quarkus.http.port=60310
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

# --------------------------------------------------------------------
# --- DEFAULT GRAPHQL CONFIGURATION
# --------------------------------------------------------------------
quarkus.smallrye-graphql.events.enabled=true
quarkus.smallrye-graphql.error-extension-fields=code,classification,description
quarkus.smallrye-graphql.show-runtime-exception-message=com.erdouglass.common.graphql.ResourceNotFoundException

# --------------------------------------------------------------------
# --- DEFAULT MESSAGING CONFIGURATION
# --------------------------------------------------------------------
mp.messaging.outgoing.ingest-media-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.ingest-media-out.exchange.name=emdb.commands
mp.messaging.outgoing.ingest-media-out.exchange.type=direct
mp.messaging.outgoing.ingest-media-out.default-routing-key=media.ingest

mp.messaging.incoming.ingest-media-in.connector=smallrye-rabbitmq
mp.messaging.incoming.ingest-media-in.exchange.name=emdb.commands
mp.messaging.incoming.ingest-media-in.exchange.type=direct
mp.messaging.incoming.ingest-media-in.routing-keys=media.ingest
mp.messaging.incoming.ingest-media-in.queue.name=emdb-ingest.ingest-media
mp.messaging.incoming.ingest-media-in.max-outstanding-messages=1

# --------------------------------------------------------------------
# --- DEFAULT TMDB CONFIGURATION
# --------------------------------------------------------------------
quarkus.rest-client.tmdb-image.url=http://image.tmdb.org/t/p/original
quarkus.rest-client.tmdb-movie.url=https://api.themoviedb.org/3
quarkus.rest-client.tmdb-person.url=https://api.themoviedb.org/3
quarkus.rest-client.tmdb-series.url=https://api.themoviedb.org/3

# --------------------------------------------------------------------
# --- DEFAULT DATABASE CONFIGURATION
# --------------------------------------------------------------------
quarkus.datasource."ingest".db-kind=postgresql
quarkus.datasource."ingest".username=${ingest.username}
quarkus.datasource."ingest".password=${ingest.password}
quarkus.hibernate-orm."ingest".datasource=ingest
quarkus.hibernate-orm."ingest".packages=com.erdouglass.emdb.ingest
quarkus.hibernate-orm."ingest".database.default-schema=emdb_ingest
quarkus.hibernate-orm."ingest".scripts.generation=create
quarkus.hibernate-orm."ingest".scripts.generation.create-target=ingest-schema.sql

quarkus.datasource."media".db-kind=postgresql
quarkus.datasource."media".username=${media.username}
quarkus.datasource."media".password=${media.password}
quarkus.hibernate-orm."media".datasource=media
quarkus.hibernate-orm."media".packages=com.erdouglass.emdb.media
quarkus.hibernate-orm."media".database.default-schema=emdb_media
quarkus.hibernate-orm."media".scripts.generation=create
quarkus.hibernate-orm."media".scripts.generation.create-target=media-schema.sql
