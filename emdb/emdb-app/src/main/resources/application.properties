# --------------------------------------------------------------------
# --- DEFAULT CONFIGURATION
# --------------------------------------------------------------------
quarkus.http.root-path=/emdb
quarkus.http.port=60310
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

# --------------------------------------------------------------------
# --- DEFAULT MESSAGING CONFIGURATION
# --------------------------------------------------------------------
mp.messaging.outgoing.ingest-media-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.ingest-media-out.exchange.name=emdb.commands
mp.messaging.outgoing.ingest-media-out.exchange.type=direct
mp.messaging.outgoing.ingest-media-out.default-routing-key=media.ingest

mp.messaging.incoming.ingest-media-in.connector=smallrye-rabbitmq
mp.messaging.incoming.ingest-media-in.exchange.name=emdb.commands
mp.messaging.incoming.ingest-media-in.exchange.type=direct
mp.messaging.incoming.ingest-media-in.routing-keys=media.ingest
mp.messaging.incoming.ingest-media-in.queue.name=emdb-ingest.ingest-media
mp.messaging.incoming.ingest-media-in.max-outstanding-messages=1

# --------------------------------------------------------------------
# --- DEFAULT TMDB CONFIGURATION
# --------------------------------------------------------------------
quarkus.rest-client.tmdb-image.url=http://image.tmdb.org/t/p/original
quarkus.rest-client.tmdb-movie.url=https://api.themoviedb.org/3
quarkus.rest-client.tmdb-person.url=https://api.themoviedb.org/3
quarkus.rest-client.tmdb-series.url=https://api.themoviedb.org/3

# --------------------------------------------------------------------
# --- DEFAULT DATABASE CONFIGURATION
# --------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${db.username}
quarkus.datasource.password=${db.password}
quarkus.hibernate-orm.database.default-schema=emdb_media
quarkus.flyway.schemas=emdb_media

quarkus.flyway.baseline-on-migrate=true
