# --------------------------------------------------------------------
# --- DEFAULT CONFIGURATION
# --------------------------------------------------------------------
quarkus.http.root-path=/emdb
quarkus.http.port=60310
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

# --------------------------------------------------------------------
# --- DEFAULT TMDB CONFIGURATION
# --------------------------------------------------------------------
quarkus.rest-client.tmdb-image.url=http://image.tmdb.org/t/p/original
quarkus.rest-client.tmdb-media.url=https://api.themoviedb.org/3

# --------------------------------------------------------------------
# --- DEFAULT MESSAGING CONFIGURATION
# --------------------------------------------------------------------

# --------------------------------------------------------------------
# --- DEFAULT GRAPHQL CONFIGURATION
# --------------------------------------------------------------------

# --------------------------------------------------------------------
# --- DEFAULT DATABASE CONFIGURATION
# --- DATASOURCES (one per module, same database)
# --- Flyway instances and Dev UI cards are per-datasource, so this is
# --- what makes emdb_media and emdb_ingest independently manageable.
# --------------------------------------------------------------------
quarkus.datasource."media".db-kind=postgresql
quarkus.datasource."media".username=emdb_app
quarkus.datasource."media".password=${EMDB_DB_PASSWORD}

quarkus.datasource."ingest".db-kind=postgresql
quarkus.datasource."ingest".username=emdb_app
quarkus.datasource."ingest".password=${EMDB_DB_PASSWORD}
quarkus.datasource."ingest".jdbc.max-size=5

# --------------------------------------------------------------------
# --- HIBERNATE (one persistence unit per module)
# --------------------------------------------------------------------
quarkus.hibernate-orm."media".datasource=media
quarkus.hibernate-orm."media".packages=com.erdouglass.emdb.media
quarkus.hibernate-orm."media".database.default-schema=emdb_media
quarkus.hibernate-orm."media".physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.hibernate-orm."ingest".datasource=ingest
quarkus.hibernate-orm."ingest".packages=com.erdouglass.emdb.ingest
quarkus.hibernate-orm."ingest".database.default-schema=emdb_ingest
quarkus.hibernate-orm."ingest".physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --------------------------------------------------------------------
# --- FLYWAY (one instance per datasource; each owns its schema, its
# --- migration location, and its own flyway_schema_history table)
# --------------------------------------------------------------------
quarkus.flyway."media".locations=classpath:db/migration/media
quarkus.flyway."media".schemas=emdb_media
quarkus.flyway."media".create-schemas=true
quarkus.flyway."media".migrate-at-start=true
quarkus.flyway."media".baseline-on-migrate=true

quarkus.flyway."ingest".locations=classpath:db/migration/ingest
quarkus.flyway."ingest".schemas=emdb_ingest
quarkus.flyway."ingest".create-schemas=true
quarkus.flyway."ingest".migrate-at-start=true
quarkus.flyway."ingest".baseline-on-migrate=true
