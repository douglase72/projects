# --------------------------------------------------------------------
# --- DEFAULT CONFIGURATION
# --------------------------------------------------------------------
quarkus.http.root-path=/emdb
quarkus.http.port=60310
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

# --------------------------------------------------------------------
# --- DEFAULT DATABASE CONFIGURATION
# --------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=emdb_app
quarkus.datasource.password=${EMDB_DB_PASSWORD}

quarkus.hibernate-orm."media".datasource=<default>
quarkus.hibernate-orm."media".packages=com.erdouglass.emdb.media
quarkus.hibernate-orm."media".database.default-schema=emdb_media
quarkus.hibernate-orm."media".scripts.generation=create
quarkus.hibernate-orm."media".scripts.generation.create-target=media-schema.sql
