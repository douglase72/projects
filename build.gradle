
subprojects {
  group = 'com.erdouglass'
  version = '0.0.1-SNAPSHOT'
  
  plugins.withId('java') {
    java {
      sourceCompatibility = JavaVersion.VERSION_25
      targetCompatibility = JavaVersion.VERSION_25
    }
  }
}

tasks.register('archCheck') {
    group = 'verification'
    description = 'All architecture rules across all modules'
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == 'archTest' } }
}
