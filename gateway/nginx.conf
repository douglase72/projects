
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
        
    proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m max_size=1g inactive=30d use_temp_path=off;
    resolver 127.0.0.11 valid=10s;
    
    # Lets WebSocket upgrades pass through cleanly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }    

    server {
        listen 80;
        server_name localhost;
        
        # EMDB Ingest service
        location ~ ^/api/v1/ingest(?:/.*)?$ {
            set $emdb_ingest emdb-ingest:60310;
            proxy_pass http://$emdb_ingest;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # EMDB Media service
        location ~ ^/api/v1/(?:movies|series|people|graphql)(?:/.*)?$ {
            set $emdb_media emdb-media:60312;
            proxy_pass http://$emdb_media;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}