
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
        
    proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m max_size=1g inactive=30d use_temp_path=off;
    resolver 127.0.0.11 valid=10s;
    
    # Lets WebSocket upgrades pass through cleanly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }    

    server {
        listen 80;
        server_name localhost;
        
        # EMDB Ingest service
        location ~ ^/emdb/api/(?:ingest|scheduler)(?:/.*)?$ {
            set $emdb_ingest emdb-ingest:60314;
            proxy_pass http://$emdb_ingest;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # EMDB Media service
        location ~ ^/emdb/api/(?:movies|series|people|graphql)(?:/.*)?$ {
            set $emdb_media emdb-media:60316;
            proxy_pass http://$emdb_media;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # EMDB UI
        location /emdb/ {
            # Use the variable for DNS resolution (prevents crash if UI is down)
            set $emdb_ui emdb-ui:80; 
            
            # Strip the /emdb/ prefix before sending to the Vue Nginx container
            rewrite ^/emdb/(.*)$ /$1 break;
            
            proxy_pass http://$emdb_ui;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        } 
        
        # EMDB "Original" Image (No resizing)
        # http://localhost/emdb/images/original/5787ee... .jpg
        location ~ "^/emdb/images/original/([a-f0-9\-]+)([a-f0-9]{2})\.jpg$" {
            set $filename "$1$2";
            set $bucket $2;
            
            root /usr/share/nginx/html;
            try_files /images/original/$bucket/$filename.jpg 
                      /images-dev/original/$bucket/$filename.jpg 
                      =404;
            add_header Cache-Control "public, max-age=31536000";
        }

        # EMDB "Resized" Image
        # http://localhost/emdb/images/w92/5787ee... .jpg
        location ~ "^/emdb/images/w([0-9]+)/([a-f0-9\-]+)([a-f0-9]{2})\.jpg$" {
            set $width $1;
            set $filename "$2$3";
            set $bucket $3; 
            
            # Tell imgproxy to fetch the original image from Nginx
            set $source_url "http://nginx/emdb/images/original/$filename.jpg";      
            proxy_pass http://imgproxy:8080/insecure/rs:fill:$width:0/plain/$source_url;
            
            proxy_cache images;
            proxy_cache_key "$uri";
            proxy_cache_valid 200 30d;
            add_header X-Cache-Status $upstream_cache_status;            
        }
    }
}